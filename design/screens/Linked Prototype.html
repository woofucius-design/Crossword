}

function Onboarding({ onComplete }) {
  const [step, setStep] = useState(0);
  const [data, setData] = useState({username:'',avatar:'owl',goal:'1400+',date:'3 months',level:'Beginner'});
  const [leaving, setLeaving] = useState(false);

  const goNext = (patch={}) => {
    setLeaving(true);
    setTimeout(()=>{ setData(d=>({...d,...patch})); setStep(s=>s+1); setLeaving(false); }, 260);
  };

  const renderStep = () => {
    switch(step) {
      case 0: return <OBSplash onNext={goNext} />;
      case 1: return <OBHook onNext={goNext} />;
      case 2: return <OBProfile data={data} onNext={goNext} />;
      case 3: return <OBGoal data={data} onNext={goNext} />;
      case 4: return <OBLevel onNext={goNext} />;
      case 5: return <OBWelcome data={data} onDone={()=>onComplete(data)} />;

  return (
    <div style={{ height:'100%', background:C.bg, display:'flex', flexDirection:'column', position:'relative', overflow:'hidden' }}>

      <BackgroundWords opacity={step<=1?1:0.3} />

              ))}
            </div>
          </div>
        )}
        <div style={{ flex:1, display:'flex', flexDirection:'column', opacity:leaving?0:1, transform:leaving?'translateY(8px)':'translateY(0)', transition:'opacity 0.25s, transform 0.25s', overflowY:'auto', overflowX:'hidden' }}>
          {renderStep()}
        </div>
      </div>
      <div style={{ position:'absolute', bottom:8, left:'50%', transform:'translateX(-50%)', width:134, height:5, borderRadius:3, background:'rgba(255,255,255,0.3)', pointerEvents:'none', zIndex:50 }} />
    </div>
  );
}

function OBHook({ onNext }) {
  const [collected, setCollected] = useState([]);
  const [done, setDone] = useState(false);
  const idxRef = useRef(0);
  const collectNext = useCallback(()=>{
    if(idxRef.current>=HOOK_WORDS.length){setDone(true);return;}
    const w=HOOK_WORDS[idxRef.current];
    setTimeout(()=>{ setCollected(c=>[...c,w]); idxRef.current++; if(idxRef.current<HOOK_WORDS.length)setTimeout(collectNext,400); else setDone(true); },900);
  },[]);
  useEffect(()=>{const t=setTimeout(collectNext,600);return()=>clearTimeout(t);},[]);
  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'0 20px 24px' }}>
      <div style={{ textAlign:'center', marginBottom:20 }}>
        <div style={{ fontFamily:'Space Grotesk', fontWeight:700, fontSize:24, color:'#fff', letterSpacing:-0.5, marginBottom:4 }}>Your collection grows<br/>with every puzzle</div>
        <div style={{ fontFamily:'Nunito', fontSize:13, color:C.muted }}>Every word you solve gets added to your library</div>
      </div>
      <div style={{ flex:1, display:'flex', flexDirection:'column', gap:8, justifyContent:'center' }}>
        {HOOK_WORDS.map((w,i)=>{
          const isCollected=collected.some(c=>c.word===w.word);
          return (
            <div key={w.word} style={{ background:isCollected?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.02)', border:`1.5px solid ${isCollected?w.color+'50':'rgba(255,255,255,0.06)'}`, borderRadius:13, padding:'10px 14px', display:'flex', alignItems:'center', gap:10, opacity:isCollected?1:0.25, transform:isCollected?'scale(1)':'scale(0.97)', transition:'all 0.4s cubic-bezier(0.22,1,0.36,1)' }}>
              <div style={{ width:32, height:32, borderRadius:9, background:isCollected?`${w.color}20`:'rgba(255,255,255,0.05)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, flexShrink:0 }}>{isCollected?'⭐':'○'}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:'Space Grotesk', fontWeight:700, fontSize:15, color:isCollected?'#fff':C.dim }}>{w.word}</div>
                <div style={{ fontFamily:'Nunito', fontSize:11, color:isCollected?C.muted:'rgba(255,255,255,0.15)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{w.def}</div>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ marginTop:16 }}>
        {done ? (
          <button onClick={onNext} style={{ width:'100%', height:50, borderRadius:15, background:'linear-gradient(135deg,#FFE566,#F5A623)', border:'none', cursor:'pointer', fontFamily:'Nunito', fontWeight:900, fontSize:16, color:'#3D2800' }}>Let's set up your profile →</button>
        ) : (
          <div style={{ height:50, borderRadius:15, background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.07)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Nunito', fontWeight:700, fontSize:14, color:C.dim }}>
            <span style={{ animation:'pulse 1s ease infinite' }}>Collecting words…</span>
          </div>
        )}
      </div>
    </div>
  );
}

function OBLevel({ onNext }) {
  const [idx, setIdx] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const q = LEVEL_WORDS[idx];
  const pick=(optIdx)=>{
    if(chosen!==null)return;
    setChosen(optIdx);
    if(optIdx===q.correct)setScore(s=>s+1);
    setTimeout(()=>{
      if(idx<LEVEL_WORDS.length-1){setIdx(i=>i+1);setChosen(null);}
      else setDone(true);
    },900);
  };
  const level = score<=1?{label:'Beginner',color:'#60A5FA'}:score<=2?{label:'Developing',color:'#34D399'}:score<=3?{label:'Intermediate',color:'#FFE566'}:{label:'Advanced',color:'#A855F7'};
  if(done) return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 24px', gap:16 }}>
      <div style={{ fontSize:48 }}>{score>=4?'🏆':score>=3?'⭐':'📚'}</div>
      <div style={{ textAlign:'center' }}>
        <div style={{ fontFamily:'Space Grotesk', fontWeight:700, fontSize:32, color:'#fff', letterSpacing:-0.8 }}>{level.label}</div>
        <div style={{ fontFamily:'Nunito', fontSize:13, color:C.muted, marginTop:6 }}>{score}/{LEVEL_WORDS.length} correct</div>
      </div>
      <button onClick={()=>onNext({level:level.label})} style={{ width:'100%', height:50, borderRadius:15, background:'linear-gradient(135deg,#FFE566,#F5A623)', border:'none', cursor:'pointer', fontFamily:'Nunito', fontWeight:900, fontSize:16, color:'#3D2800' }}>Start Playing →</button>
    </div>
  );
  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'0 20px 24px' }}>
      <div style={{ textAlign:'center', marginBottom:18 }}>
        <div style={{ fontFamily:'Space Grotesk', fontWeight:700, fontSize:22, color:'#fff' }}>Quick level check</div>
        <div style={{ fontFamily:'Nunito', fontSize:12, color:C.muted }}>{LEVEL_WORDS.length} words · takes 30 seconds</div>
      </div>
      <div style={{ display:'flex', gap:4, marginBottom:20 }}>
        {LEVEL_WORDS.map((_,i)=><div key={i} style={{ flex:1, height:3, borderRadius:2, background:i<idx?C.mint:i===idx?C.yellow:'rgba(255,255,255,0.1)', transition:'background 0.3s' }} />)}
      </div>
      <div style={{ background:C.surface, borderRadius:16, border:'1px solid rgba(255,255,255,0.08)', padding:'18px 18px 14px', marginBottom:14, textAlign:'center' }}>
        <div style={{ fontFamily:'Nunito', fontWeight:700, fontSize:10, color:C.muted, textTransform:'uppercase', letterSpacing:1, marginBottom:8 }}>What does this SAT word mean?</div>
        <div style={{ fontFamily:'Space Grotesk', fontWeight:700, fontSize:28, color:C.yellow, letterSpacing:-0.5 }}>{q.word}</div>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:8, flex:1 }}>
        {q.options.map((opt,i)=>{
          let bg='rgba(255,255,255,0.05)',border='rgba(255,255,255,0.09)',color='#fff';
          if(chosen!==null){ if(i===q.correct){bg='rgba(52,211,153,0.12)';border='rgba(52,211,153,0.4)';color=C.mint;} else if(i===chosen&&i!==q.correct){bg='rgba(239,68,68,0.1)';border='rgba(239,68,68,0.35)';color='#FCA5A5';} else color=C.dim; }
          return (
            <div key={i} onClick={()=>pick(i)} style={{ background:bg, border:`1.5px solid ${border}`, borderRadius:12, padding:'12px 14px', display:'flex', alignItems:'center', gap:10, cursor:chosen===null?'pointer':'default', transition:'all 0.2s' }}>
              <div style={{ width:26, height:26, borderRadius:8, background:chosen!==null&&i===q.correct?'rgba(52,211,153,0.2)':chosen!==null&&i===chosen&&i!==q.correct?'rgba(239,68,68,0.15)':'rgba(255,255,255,0.07)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Space Grotesk', fontWeight:700, fontSize:12, color }}>{chosen!==null&&i===q.correct?'✓':chosen!==null&&i===chosen&&i!==q.correct?'✗':String.fromCharCode(65+i)}</div>
              <div style={{ fontFamily:'Nunito', fontSize:13, color, lineHeight:1.4 }}>{opt}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// SCREEN: CROSSWORD PUZZLE
// ══════════════════════════════════════════════════════════
const KB_ROWS=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['⌫','Z','X','C','V','B','N','M','↵']];

function CrosswordScreen({ onBack, onWordCollected }) {
  const [grid, setGrid] = useState(()=>{ const g={}; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) g[`${r},${c}`]=PRE_FILLED[`${r},${c}`]||''; return g; });
  const [animKeys, setAnimKeys] = useState({});
  const [rippleCells, setRippleCells] = useState({});
  const [sel, setSel] = useState({r:4,c:0});
  const [dir, setDir] = useState('across');
  const [completedWords, setCompletedWords] = useState(new Set());
  const [collectedWords, setCollectedWords] = useState(new Set());
  const [toastWord, setToastWord] = useState(null);
  const [timer, setTimer] = useState(127);
  useEffect(()=>{ const t=setInterval(()=>setTimer(n=>n+1),1000); return()=>clearInterval(t); },[]);
  const timeStr=`${String(Math.floor(timer/60)).padStart(2,'0')}:${String(timer%60).padStart(2,'0')}`;
  const activeWord=getWordForCell(sel.r,sel.c,dir)||getWordForCell(sel.r,sel.c,dir==='across'?'down':'across');
  const activeWordCells=activeWord?new Set(getCells(activeWord).map(cl=>`${cl.r},${cl.c}`)):new Set();
  const checkWord=useCallback((g,w)=>getCells(w).every(({r,c})=>g[`${r},${c}`]===SOLUTION[r][c]),[]);
  const advanceCursor=(r,c,d)=>{ const w=getWordForCell(r,c,d); if(!w)return; const cells=getCells(w); const idx=cells.findIndex(cl=>cl.r===r&&cl.c===c); if(idx<cells.length-1)setSel(cells[idx+1]); };
  const retreatCursor=(r,c,d)=>{ const w=getWordForCell(r,c,d); if(!w)return; const cells=getCells(w); const idx=cells.findIndex(cl=>cl.r===r&&cl.c===c); if(idx>0)setSel(cells[idx-1]); };
  const handleCellClick=(r,c)=>{ if(SOLUTION[r][c]==='#')return; if(sel.r===r&&sel.c===c){const nd=dir==='across'?'down':'across'; if(getWordForCell(r,c,nd))setDir(nd);} else { setSel({r,c}); const ha=getWordForCell(r,c,'across'),hd=getWordForCell(r,c,'down'); if(ha&&!hd)setDir('across'); else if(hd&&!ha)setDir('down'); } };
  const handleKey=useCallback((k)=>{
    if(k==='⌫'||k==='Backspace'){setGrid(g=>({...g,[`${sel.r},${sel.c}`]:''})); retreatCursor(sel.r,sel.c,dir); return;}
    if(k==='↵'||k==='Enter')return;
    const letter=k.toUpperCase(); if(!/^[A-Z]$/.test(letter))return;
    const key=`${sel.r},${sel.c}`; const newGrid={...grid,[key]:letter};
    setGrid(newGrid); setAnimKeys(prev=>({...prev,[key]:Date.now()}));
    const newlyDone=[];
    CW_WORDS.forEach(w=>{ if(!completedWords.has(w.id)&&checkWord(newGrid,w))newlyDone.push(w); });
    if(newlyDone.length>0){
      const newCompleted=new Set([...completedWords,...newlyDone.map(w=>w.id)]);
      setCompletedWords(newCompleted);
      newlyDone.forEach(w=>{ const cells=getCells(w); const updates={}; cells.forEach((cl,i)=>{updates[`${cl.r},${cl.c}`]=`${i*0.05}s`;}); setRippleCells(prev=>({...prev,...updates})); setTimeout(()=>setRippleCells(prev=>{const next={...prev};cells.forEach(cl=>delete next[`${cl.r},${cl.c}`]);return next;}),cells.length*50+600); });
      const vocabDone=newlyDone.find(w=>SAT_WORDS.has(w.word)&&!collectedWords.has(w.id));
      if(vocabDone){ setCollectedWords(s=>new Set([...s,vocabDone.id])); setTimeout(()=>setToastWord(vocabDone),350); onWordCollected({id:Date.now(),word:vocabDone.word,def:vocabDone.def,mastery:'new',collected:'just now',lastReview:null,retention:100,reviews:0,daysAgo:0,isNew:true}); }
    }
    advanceCursor(sel.r,sel.c,dir);
  },[sel,dir,grid,completedWords,collectedWords,checkWord]);
  useEffect(()=>{ const h=e=>handleKey(e.key==='Backspace'?'⌫':e.key); window.addEventListener('keydown',h); return()=>window.removeEventListener('keydown',h); },[handleKey]);
  const CELL_SIZE=33,GAP=2;
  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:C.bg, position:'relative', overflow:'hidden', paddingTop:62 }}>
      <StatusBar />
      <div style={{ padding:'2px 14px 6px', display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
        <div onClick={onBack} style={{ color:'rgba(255,255,255,0.4)', fontSize:22, cursor:'pointer', padding:'0 4px' }}>‹</div>
        <div style={{ flex:1 }}>
          <div style={{ fontFamily:'Nunito', fontWeight:900, fontSize:16, color:'#fff', letterSpacing:-0.2 }}>Daily Mini #48</div>
          <div style={{ fontFamily:'Nunito', fontSize:10, color:'rgba(255,255,255,0.4)' }}>SAT Vocabulary · May 3</div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:5, background:'rgba(255,107,53,0.12)', borderRadius:9, padding:'3px 8px' }}>
          <span style={{fontSize:12}}>🔥</span><span style={{ fontFamily:'Nunito', fontWeight:800, fontSize:13, color:'#FF6B35' }}>7</span>
        </div>
        <div style={{ background:'rgba(255,255,255,0.06)', borderRadius:9, padding:'3px 9px' }}>
          <span style={{ fontFamily:'Space Grotesk', fontWeight:600, fontSize:13, color:'#fff', letterSpacing:1 }}>{timeStr}</span>
        </div>
      </div>
      {/* progress */}
      <div style={{ padding:'0 14px 8px' }}>
        <div style={{ height:3, background:'rgba(255,255,255,0.08)', borderRadius:2, overflow:'hidden' }}>
          <div style={{ height:'100%', width:`${(completedWords.size/CW_WORDS.length)*100}%`, background:'linear-gradient(90deg,#34D399,#10B981)', borderRadius:2, transition:'width 0.6s cubic-bezier(0.22,1,0.36,1)' }} />
        </div>
        <div style={{ display:'flex', justifyContent:'space-between', marginTop:3 }}>
          <span style={{ fontFamily:'Nunito', fontSize:9, color:'rgba(255,255,255,0.3)', textTransform:'uppercase', letterSpacing:0.5 }}>{completedWords.size}/{CW_WORDS.length} words</span>
          <span style={{ fontFamily:'Nunito', fontSize:9, color:'#34D399', fontWeight:700 }}>{Math.round((completedWords.size/CW_WORDS.length)*100)}%</span>
        </div>
      </div>
      {/* grid */}
      <div style={{ display:'flex', justifyContent:'center', padding:'4px 0 8px', flexShrink:0 }}>
        <div style={{ display:'grid', gridTemplateColumns:`repeat(${COLS},${CELL_SIZE}px)`, gridTemplateRows:`repeat(${ROWS},${CELL_SIZE}px)`, gap:GAP, background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:10, padding:5 }}>
          {Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,c)=>{
            const key=`${r},${c}`,sol=SOLUTION[r][c],letter=grid[key];
            const rippleDelay=rippleCells[key];
            const isVocabCell=CW_WORDS.some(w=>SAT_WORDS.has(w.word)&&getCells(w).some(cl=>cl.r===r&&cl.c===c));
            if(sol==='#') return <div key={key} style={{ width:'100%', aspectRatio:'1', background:'#1a1a1a', borderRadius:2 }} />;
            let bg='#F8F5EE';
            if(activeWordCells.has(key)&&!(sel.r===r&&sel.c===c))bg='#C9E8FF';
            if(sel.r===r&&sel.c===c)bg='#FFD84C';
            const borderColor=sel.r===r&&sel.c===c?'#E8A800':activeWordCells.has(key)&&!(sel.r===r&&sel.c===c)?'#8DC8E8':'#BBBBBB';
            return (
              <div key={key} style={rippleDelay?{'--ripple-delay':rippleDelay}:undefined}>
                <div onClick={()=>handleCellClick(r,c)} style={{ width:'100%', aspectRatio:'1', background:bg, border:`1.5px solid ${borderColor}`, borderRadius:2, position:'relative', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', transition:'background 0.12s', '--cell-bg':bg, animation:rippleDelay?`${isVocabCell?'wordRippleVocab':'wordRipple'} 0.5s ease var(--ripple-delay,0s) 1`:undefined }}>
                  {CELL_NUMS[key]&&<span style={{ position:'absolute', top:1.5, left:2.5, fontFamily:'Space Grotesk,sans-serif', fontWeight:700, fontSize:7, color:sel.r===r&&sel.c===c?'#7A5C00':'#777', lineHeight:1, userSelect:'none' }}>{CELL_NUMS[key]}</span>}
                  {letter&&<span key={animKeys[key]} className={animKeys[key]?'cell-letter':undefined} style={{ fontFamily:'Space Grotesk,sans-serif', fontWeight:700, fontSize:14, color:'#111', lineHeight:1, userSelect:'none' }}>{letter}</span>}
                </div>
              </div>
            );
          }))}
        </div>
      </div>
      {/* clue bar */}
      {activeWord&&(
        <div style={{ margin:'0 14px', background:SAT_WORDS.has(activeWord.word)?'rgba(255,229,102,0.08)':'rgba(255,255,255,0.05)', border:`1px solid ${SAT_WORDS.has(activeWord.word)?'rgba(255,229,102,0.2)':'rgba(255,255,255,0.08)'}`, borderRadius:11, padding:'8px 12px', display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
          <div style={{ minWidth:30, height:30, borderRadius:8, background:SAT_WORDS.has(activeWord.word)?'rgba(255,229,102,0.18)':'rgba(255,255,255,0.08)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Space Grotesk,sans-serif', fontWeight:700, fontSize:11, color:SAT_WORDS.has(activeWord.word)?'#FFE566':'rgba(255,255,255,0.5)', flexShrink:0 }}>{activeWord.num}{activeWord.dir==='across'?'A':'D'}</div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:'Nunito,sans-serif', fontWeight:600, fontSize:12, color:'rgba(255,255,255,0.85)', lineHeight:1.35, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', textDecoration:completedWords.has(activeWord.id)?'line-through':'none', opacity:completedWords.has(activeWord.id)?0.5:1 }}>{activeWord.clue}</div>

function focusReason(w) {
  if(w.retention<45)return{label:'About to forget',color:'#EF4444',icon:'⚠'};
  if(w.retention<60)return{label:'Slipping fast',color:'#F97316',icon:'↘'};
  if(w.daysAgo>=5)return{label:'Long overdue',color:'#EAB308',icon:'⏰'};
  if(w.mastery==='learning'&&w.daysAgo>=2)return{label:'Reinforce now',color:'#60A5FA',icon:'↑'};
  return{label:'Good time to review',color:'#34D399',icon:'✓'};
}
function RetentionArc({ pct, size=36, color }) {
  const r=(size-6)/2,circ=2*Math.PI*r,dash=(pct/100)*circ;
  return (
    <svg width={size} height={size} style={{ transform:'rotate(-90deg)', flexShrink:0 }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="3.5" />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="3.5" strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" style={{ transition:'stroke-dasharray 0.5s ease' }} />
    </svg>
  );
}

function QuizTab() {
  const questions=[
    {word:'EPHEMERAL',correct:'lasting for a very short time',options:['lasting for a very short time','extremely wealthy','using too many words','dealing with facts only']},
    {word:'OPULENT',correct:'ostentatiously rich and luxurious',options:['lacking imagination','ostentatiously rich and luxurious','holding firm under pressure','expressed too briefly']},
    {word:'STOIC',correct:'enduring pain without showing feelings',options:['talking too much','enduring pain without showing feelings','lasting only a moment','open and honest']},
    {word:'PRAGMATIC',correct:'dealing with things sensibly and realistically',options:['overly dramatic','of great wealth','dealing with things sensibly and realistically','completely original']},
  ];
  const [idx, setIdx]=useState(0);
  const [chosen, setChosen]=useState(null);
  const [score, setScore]=useState(0);
  const [done, setDone]=useState(false);
  const q=questions[idx];
  const pick=(opt)=>{ if(chosen)return; setChosen(opt); if(opt===q.correct)setScore(s=>s+1); setTimeout(()=>{ if(idx<questions.length-1){setIdx(i=>i+1);setChosen(null);}else setDone(true); },1000); };
  if(done){const pct=Math.round((score/questions.length)*100); return (
    <div style={{ padding:'20px 14px', flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:14 }}>
      <div style={{fontSize:48}}>{pct>=75?'🏆':pct>=50?'💪':'📚'}</div>
      <div style={{ fontFamily:'Space Grotesk', fontWeight:700, fontSize:28, color:'#fff' }}>{pct}%</div>
      <div style={{ fontFamily:'Nunito', fontWeight:700, fontSize:16, color:C.muted }}>{score} of {questions.length} correct</div>
      <button onClick={()=>{setIdx(0);setChosen(null);setScore(0);setDone(false);}} style={{ height:48, borderRadius:14, padding:'0 28px', background:'linear-gradient(135deg,#FFE566,#F5A623)', border:'none', cursor:'pointer', fontFamily:'Nunito', fontWeight:900, fontSize:15, color:'#3D2800' }}>Try Again</button>
    </div>
  );}
  return (
    <div style={{ padding:'0 14px', flex:1, display:'flex', flexDirection:'column', gap:14 }}>
      <div style={{ display:'flex', gap:4 }}>
        {questions.map((_,i)=><div key={i} style={{ flex:1, height:3, borderRadius:2, background:i<=idx?C.yellow:'rgba(255,255,255,0.1)' }} />)}
      </div>
      <div style={{ background:C.surface, borderRadius:16, padding:'18px 18px 16px', border:'1px solid rgba(255,255,255,0.08)' }}>
        <div style={{ fontFamily:'Nunito', fontWeight:700, fontSize:11, color:C.muted, textTransform:'uppercase', letterSpacing:1, marginBottom:10 }}>Which definition matches?</div>
        <div style={{ fontFamily:'Space Grotesk', fontWeight:700, fontSize:28, color:C.yellow, letterSpacing:-0.5 }}>{q.word}</div>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {q.options.map((opt,i)=>{
          let bg='rgba(255,255,255,0.05)',border='rgba(255,255,255,0.08)',textColor='#fff';
          if(chosen){if(opt===q.correct){bg='rgba(52,211,153,0.12)';border='rgba(52,211,153,0.4)';textColor=C.mint;}else if(opt===chosen&&opt!==q.correct){bg='rgba(239,68,68,0.1)';border='rgba(239,68,68,0.35)';textColor='#FCA5A5';}else{bg='rgba(255,255,255,0.02)';textColor=C.dim;}}
          return (
            <div key={i} onClick={()=>pick(opt)} style={{ background:bg, border:`1.5px solid ${border}`, borderRadius:12, padding:'13px 14px', cursor:chosen?'default':'pointer', display:'flex', alignItems:'center', gap:10, transition:'all 0.2s' }}>
              <div style={{ width:26, height:26, borderRadius:8, background:chosen&&opt===q.correct?'rgba(52,211,153,0.2)':chosen&&opt===chosen&&opt!==q.correct?'rgba(239,68,68,0.15)':'rgba(255,255,255,0.07)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Space Grotesk', fontWeight:700, fontSize:12, color:textColor, flexShrink:0 }}>
                {chosen&&opt===q.correct?'✓':chosen&&opt===chosen&&opt!==q.correct?'✗':String.fromCharCode(65+i)}
              </div>
              <div style={{ fontFamily:'Nunito', fontSize:13, color:textColor, lineHeight:1.4 }}>{opt}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ScoreRing({ score, size=80, color, label, delay=0 }) {
  const [displayed, setDisplayed]=useState(0);
  const r=(size-10)/2, circ=2*Math.PI*r;
  useEffect(()=>{
    const start=Date.now()+delay, duration=900;
    const tick=()=>{ const now=Date.now(); if(now<start){requestAnimationFrame(tick);return;} const t=Math.min((now-start)/duration,1); const ease=1-Math.pow(1-t,3); setDisplayed(Math.round(ease*score)); if(t<1)requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  },[score,delay]);
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
      <div style={{ position:'relative', width:size, height:size }}>
        <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth="5" />
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="5" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ-(displayed/100)*circ} style={{ transition:'stroke-dashoffset 0.05s linear', filter:`drop-shadow(0 0 4px ${color}80)` }} />
        </svg>
        <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Space Grotesk', fontWeight:700, fontSize:size*0.24, color:'#fff' }}>{displayed}</div>
      </div>

}

function WriteScreen({ onNav }) {
  const [passage, setPassage]=useState('');
  const [phase, setPhase]=useState('write');
  const [result, setResult]=useState(null);
  const [gradingStep, setGradingStep]=useState(0);
  const usedWords=TARGET_WORDS.filter(t=>{const re=new RegExp(`\\b${t.word}\\b`,'i');return re.test(passage);});
  const usedSet=new Set(usedWords.map(w=>w.word));
  const wordCount=passage.trim().split(/\s+/).filter(Boolean).length;
  const canSubmit=passage.trim().length>20&&usedWords.length>=1;

  const GRADING_PROMPT=(passage,words)=>`You are grading a high school student's vocabulary passage. They were given these SAT words: ${words.map(w=>`${w.word} (${w.def})`).join(', ')}. Their passage: "${passage}". Grade on ACCURACY (0-100), CONCISENESS (0-100), CREATIVITY (0-100). Return ONLY valid JSON: {"accuracy":<n>,"conciseness":<n>,"creativity":<n>,"feedback":"<2-3 sentences>","wordFeedback":[{"word":"<W>","used":<bool>,"correct":<bool>,"note":"<1 sentence>"}]}`;

  const submit=async()=>{
    setPhase('grading'); setGradingStep(0);
    const steps=[1200,1000,1100,700];
    let i=0; const advance=()=>{ i++; if(i<steps.length){setGradingStep(i);setTimeout(advance,steps[i]);}};
    setTimeout(advance,steps[0]);
    try {
      const raw=await window.claude.complete(GRADING_PROMPT(passage,TARGET_WORDS));
      const match=raw.match(/\{[\s\S]*\}/); if(!match)throw new Error('No JSON');
      const parsed=JSON.parse(match[0]); setResult(parsed); setTimeout(()=>setPhase('result'),400);
    } catch {
      const accuracy=Math.min(98,50+usedWords.length*12+Math.floor(Math.random()*10));
      const conciseness=Math.max(40,Math.min(95,110-wordCount*0.8+usedWords.length*8));
      const creativity=60+Math.floor(Math.random()*30);
      setResult({ accuracy, conciseness, creativity, feedback:`You used ${usedWords.length} of ${TARGET_WORDS.length} target words. ${usedWords.length>=4?'Excellent coverage!':'Try to work in more words.'} ${wordCount<40?'Great conciseness.':'Consider tightening the passage.'}`, wordFeedback:TARGET_WORDS.map(t=>({word:t.word,used:usedSet.has(t.word),correct:usedSet.has(t.word),note:usedSet.has(t.word)?'Used correctly in context.':'Not found — try fitting it in.'})) });
      setTimeout(()=>setPhase('result'),400);
    }
  };

  if(phase==='grading') return (
    <div style={{ height:'100%', background:C.bg, display:'flex', flexDirection:'column' }}>
      <StatusBar />
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 24px', gap:28 }}>

        <div style={{ width:'100%' }}>
          {[{label:'Checking word accuracy…',color:'#60A5FA'},{label:'Measuring conciseness…',color:'#34D399'},{label:'Evaluating creativity…',color:'#F59E0B'},{label:'Compiling your score…',color:'#A855F7'}].map((s,i)=>(
            <div key={i} style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14, opacity:i<=gradingStep?1:0.25, transition:'opacity 0.3s' }}>
              <div style={{ width:24, height:24, borderRadius:8, flexShrink:0, background:i<gradingStep?`${s.color}25`:i===gradingStep?`${s.color}15`:'rgba(255,255,255,0.05)', border:`1.5px solid ${i<=gradingStep?s.color+'60':'rgba(255,255,255,0.08)'}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12 }}>

              </div>
              <div style={{ fontFamily:'Nunito', fontWeight:i===gradingStep?800:600, fontSize:14, color:i<=gradingStep?'#fff':C.dim }}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  if(phase==='result'&&result) {
    const overall=Math.round((result.accuracy+result.conciseness+result.creativity)/3);
    const grade=overall>=90?{label:'Exceptional',color:'#A855F7',emoji:'🌟'}:overall>=78?{label:'Strong',color:'#34D399',emoji:'✅'}:overall>=65?{label:'Good',color:'#EAB308',emoji:'📈'}:{label:'Keep Practicing',color:'#F97316',emoji:'💪'};
    const playerEntry={rank:0,name:'You',avatar:'Y',avatarColor:C.yellow,score:overall,accuracy:result.accuracy,conciseness:result.conciseness,creativity:result.creativity,passage,wordsUsed:usedWords.length};
    const withPlayer=[...CLASSMATES,playerEntry].sort((a,b)=>b.score-a.score).map((e,i)=>({...e,rank:i+1}));

// ROOT APP — NAVIGATION ORCHESTRATOR
// ══════════════════════════════════════════════════════════
function LexiconApp() {
  const [screen, setScreen] = useState('onboarding');
  const [prevScreen, setPrevScreen] = useState(null);
  const [transitioning, setTransitioning] = useState(false);
  const [user, setUser] = useState({ username:'Alex', avatar:'owl', goal:'1400+', level:'Intermediate' });
  const [words, setWords] = useState(INITIAL_WORDS);

  // Persist nav position
  useEffect(()=>{ try { const s=localStorage.getItem('lexicon_screen'); if(s&&s!=='onboarding')setScreen(s); const u=localStorage.getItem('lexicon_user'); if(u)setUser(JSON.parse(u)); } catch{} },[]);
  useEffect(()=>{ try { localStorage.setItem('lexicon_screen',screen); } catch{} },[screen]);

  const navigate=(to)=>{
    if(transitioning||to===screen)return;
    setTransitioning(true);
    setTimeout(()=>{ setPrevScreen(screen); setScreen(to); setTransitioning(false); },260);
  };

  const handleOnboardingComplete=(data)=>{
    setUser(data);
    try{localStorage.setItem('lexicon_user',JSON.stringify(data));}catch{}
    navigate('home');
  };

  const handleWordCollected=(word)=>{
    setWords(prev=>{
      if(prev.some(w=>w.word===word.word))return prev;
      return [{...word,id:Date.now()},...prev];
    });
  };

  const handleNav=(id)=>{
    const map={home:'home',puzzle:'puzzle',collection:'collection',review:'review',write:'write',profile:'home'};
    navigate(map[id]||'home');
  };

  const screenStyle={ position:'absolute', inset:0, animation:transitioning?'screenOut 0.25s ease forwards':'screenIn 0.3s cubic-bezier(0.22,1,0.36,1) both' };

  return (
    <div style={{ position:'relative', width:'100%', height:'100%', overflow:'hidden' }}>
      {screen==='onboarding'&&(
        <div style={screenStyle}><Onboarding onComplete={handleOnboardingComplete} /></div>
      )}
      {screen==='home'&&(
        <div style={screenStyle}><HomeScreen user={user} words={words} onNav={handleNav} onPlay={()=>navigate('puzzle')} /></div>
      )}
      {screen==='puzzle'&&(
        <div style={screenStyle}><CrosswordScreen onBack={()=>navigate('home')} onWordCollected={handleWordCollected} /></div>
      )}
      {screen==='collection'&&(
        <div style={screenStyle}><CollectionScreen words={words} onNav={handleNav} onBack={()=>navigate('home')} /></div>
      )}
      {screen==='review'&&(
        <div style={screenStyle}><ReviewScreen onNav={handleNav} /></div>
      )}
      {screen==='write'&&(
        <div style={screenStyle}><WriteScreen onNav={handleNav} /></div>
      )}
    </div>
  );
}

function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "startScreen": "onboarding",
    "wordCount": 20
  }/*EDITMODE-END*/;

  const [tweaks, setTweaksState] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [appKey, setAppKey] = useState(0);
  const [currentScreen, setCurrentScreen] = useState(TWEAK_DEFAULTS.startScreen);

  const setTweak = (key, value) => {
    const next = typeof key === 'object' ? {...tweaks,...key} : {...tweaks,[key]:value};
    setTweaksState(next);
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:next},'*');
    if(key==='startScreen'||next.startScreen!==tweaks.startScreen){
      setCurrentScreen(next.startScreen||'onboarding');
      setAppKey(k=>k+1);
    }
  };

  useEffect(()=>{
    const handler=(e)=>{
      if(e.data?.type==='__activate_edit_mode')setTweaksVisible(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaksVisible(false);
    };
    window.addEventListener('message',handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',handler);
  },[]);

  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', background:'radial-gradient(ellipse at 40% 50%,#1a1a2e 0%,#07080f 60%)' }}>
      <div style={{ position:'absolute', top:16, left:0, right:0, textAlign:'center' }}>
        <div style={{ fontFamily:'Nunito', fontWeight:900, fontSize:11, color:'rgba(255,255,255,0.2)', letterSpacing:3, textTransform:'uppercase' }}>LEXICON · Interactive Prototype</div>
      </div>
      <div style={{ width:402, height:874, borderRadius:48, overflow:'hidden', background:C.bg, boxShadow:'0 40px 100px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.08)', position:'relative' }}>
        <div style={{ position:'absolute', top:12, left:'50%', transform:'translateX(-50%)', width:126, height:36, borderRadius:20, background:'#000', zIndex:50, pointerEvents:'none' }} />
        <LexiconApp key={appKey} initialScreen={currentScreen} />
        <TweaksPanel tweaks={tweaks} setTweak={setTweak} visible={tweaksVisible} onClose={()=>{ setTweaksVisible(false); window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); }} />
      </div>
    </div>
  );
}

// Pass initialScreen into LexiconApp
function LexiconAppWrapper({ initialScreen }) {
  const [screen, setScreen] = useState(initialScreen||'onboarding');
  const [transitioning, setTransitioning] = useState(false);
  const [user, setUser] = useState({ username:'Alex', avatar:'owl', goal:'1400+', level:'Intermediate' });
  const [words, setWords] = useState(INITIAL_WORDS);

  const navigate=(to)=>{
    if(transitioning||to===screen)return;
    setTransitioning(true);
    setTimeout(()=>{ setScreen(to); setTransitioning(false); },260);
  };

  const handleOnboardingComplete=(data)=>{ setUser(data); navigate('home'); };
  const handleWordCollected=(word)=>{ setWords(prev=>{ if(prev.some(w=>w.word===word.word))return prev; return [{...word,id:Date.now()},...prev]; }); };
  const handleNav=(id)=>{ const map={home:'home',puzzle:'puzzle',collection:'collection',review:'review',write:'write',profile:'home'}; navigate(map[id]||'home'); };

  const screenStyle={ position:'absolute', inset:0, animation:transitioning?'screenOut 0.25s ease forwards':'screenIn 0.3s cubic-bezier(0.22,1,0.36,1) both' };
  return (
    <div style={{ position:'relative', width:'100%', height:'100%', overflow:'hidden' }}>
      {screen==='onboarding'&&<div style={screenStyle}><Onboarding onComplete={handleOnboardingComplete} /></div>}
      {screen==='home'&&<div style={screenStyle}><HomeScreen user={user} words={words} onNav={handleNav} onPlay={()=>navigate('puzzle')} /></div>}
      {screen==='puzzle'&&<div style={screenStyle}><CrosswordScreen onBack={()=>navigate('home')} onWordCollected={handleWordCollected} /></div>}
      {screen==='collection'&&<div style={screenStyle}><CollectionScreen words={words} onNav={handleNav} onBack={()=>navigate('home')} /></div>}
      {screen==='review'&&<div style={screenStyle}><ReviewScreen onNav={handleNav} /></div>}
      {screen==='write'&&<div style={screenStyle}><WriteScreen onNav={handleNav} /></div>}
    </div>
  );
}

// Redefine App to use the wrapper
function AppFinal() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "startScreen": "onboarding",
    "wordCount": 20
  }/*EDITMODE-END*/;

  const [tweaks, setTweaksState] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [appKey, setAppKey] = useState(0);
  const [currentScreen, setCurrentScreen] = useState(TWEAK_DEFAULTS.startScreen);

  const setTweak = (key, value) => {
    const next = typeof key === 'object' ? {...tweaks,...key} : {...tweaks,[key]:value};
    setTweaksState(next);
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:next},'*');
    if((typeof key==='string'&&key==='startScreen')||(typeof key==='object'&&key.startScreen)){
      setCurrentScreen(typeof key==='string'?value:key.startScreen);
      setAppKey(k=>k+1);
    }
  };

  useEffect(()=>{
    const handler=(e)=>{
      if(e.data?.type==='__activate_edit_mode')setTweaksVisible(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaksVisible(false);
    };
    window.addEventListener('message',handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',handler);
  },[]);

  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', background:'radial-gradient(ellipse at 40% 50%,#1a1a2e 0%,#07080f 60%)' }}>
      <div style={{ position:'absolute', top:16, left:0, right:0, textAlign:'center' }}>
        <div style={{ fontFamily:'Nunito', fontWeight:900, fontSize:11, color:'rgba(255,255,255,0.2)', letterSpacing:3, textTransform:'uppercase' }}>LEXICON · Linked Prototype</div>
      </div>
      <div style={{ width:402, height:874, borderRadius:48, overflow:'hidden', background:C.bg, boxShadow:'0 40px 100px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.08)', position:'relative' }}>
        <div style={{ position:'absolute', top:12, left:'50%', transform:'translateX(-50%)', width:126, height:36, borderRadius:20, background:'#000', zIndex:50, pointerEvents:'none' }} />
        <LexiconAppWrapper key={appKey} initialScreen={currentScreen} />
        <TweaksPanel tweaks={tweaks} setTweak={setTweak} visible={tweaksVisible} onClose={()=>{ setTweaksVisible(false); window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); }} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppFinal />);
</script>
