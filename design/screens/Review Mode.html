<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexicon – Review Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #07080f; display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; overflow: hidden; }

    @keyframes slideInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes cardFlip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(180deg); } }
    @keyframes cardFlipBack { 0% { transform: rotateY(180deg); } 100% { transform: rotateY(0deg); } }
    @keyframes typing { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dotBounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    @keyframes popIn { 0% { transform: scale(0.8) translateY(8px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes wordReveal { from { background-color: rgba(255,229,102,0.5); } to { background-color: rgba(255,229,102,0.15); } }
    ::-webkit-scrollbar { width: 0; }

    .word-highlight {
      background: rgba(255,229,102,0.15);
      border-bottom: 2px solid #FFE566;
      border-radius: 3px;
      padding: 1px 2px;
      cursor: pointer;
      transition: background 0.15s;
      display: inline;
    }
    .word-highlight:hover, .word-highlight.active {
      background: rgba(255,229,102,0.3);
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;

// ── Palette ────────────────────────────────────────────────────
const C = {
  bg: '#0D1B2A', surface: '#132236', card: '#16293D',
  border: 'rgba(255,255,255,0.07)', text: '#FFFFFF',
  muted: 'rgba(255,255,255,0.45)', dim: 'rgba(255,255,255,0.22)',
  yellow: '#FFE566', orange: '#FF6B35', mint: '#34D399',
};

// ── Review word pool (prioritized by AI) ───────────────────────
const REVIEW_WORDS = [
  { word: 'OPULENT',   def: 'ostentatiously rich and luxurious',              retention: 36, mastery: 'familiar' },
  { word: 'EPHEMERAL', def: 'lasting for a very short time',                  retention: 41, mastery: 'familiar' },
  { word: 'VERBOSE',   def: 'using more words than necessary',                retention: 49, mastery: 'familiar' },
  { word: 'PRAGMATIC', def: 'dealing with things sensibly and realistically', retention: 61, mastery: 'familiar' },
  { word: 'STOIC',     def: 'enduring pain without showing feelings',         retention: 55, mastery: 'familiar' },
  { word: 'CANDOR',    def: 'the quality of being open and honest',           retention: 78, mastery: 'learning' },
  { word: 'BANAL',     def: 'so lacking originality as to be boring',         retention: 65, mastery: 'learning' },
  { word: 'LUCID',     def: 'clearly expressed; easy to understand',          retention: 100, mastery: 'new' },
];

const MASTERY_COLOR = { new:'#60A5FA', learning:'#F97316', familiar:'#EAB308', strong:'#22C55E', mastered:'#A855F7' };

// ── Pre-baked fallback passages ────────────────────────────────
const FALLBACKS = [
  {
    text: "The celebrity's OPULENT mansion was filled with EPHEMERAL art installations that dissolved in rain — a design choice so impractical that even his STOIC butler abandoned his usual CANDOR and simply wept. His life coach, a notoriously VERBOSE wellness guru, assured him this was all very PRAGMATIC, which said everything about the life coach.",
    words: ['OPULENT','EPHEMERAL','STOIC','CANDOR','VERBOSE','PRAGMATIC'],
  },
  {
    text: "The mayor's VERBOSE press conference on PRAGMATIC budget cuts was so BANAL that three journalists achieved a kind of STOIC transcendence, their minds drifting to more OPULENT concerns, like why the chandelier appeared to be made of cheese. A LUCID observer would have left immediately.",
    words: ['VERBOSE','PRAGMATIC','BANAL','STOIC','OPULENT','LUCID'],
  },
  {
    text: "With CANDOR rare among supervillains, Dr. Nefario admitted that his EPHEMERAL force field — which lasted exactly four seconds — was perhaps not PRAGMATIC for world domination. The hero agreed, though he was too STOIC to laugh out loud at the OPULENT volcano lair that now belonged to a family of raccoons.",
    words: ['CANDOR','EPHEMERAL','PRAGMATIC','STOIC','OPULENT'],
  },
];

// ── Flashcard data ─────────────────────────────────────────────
const FLASHCARDS = REVIEW_WORDS.slice(0, 6);

// ── Quiz data ──────────────────────────────────────────────────
const QUIZ_QUESTIONS = [
  { word: 'EPHEMERAL', correct: 'lasting for a very short time', options: ['lasting for a very short time', 'extremely wealthy', 'using too many words', 'dealing with facts only'] },
  { word: 'OPULENT', correct: 'ostentatiously rich and luxurious', options: ['lacking imagination', 'ostentatiously rich and luxurious', 'holding firm under pressure', 'expressed too briefly'] },
  { word: 'STOIC', correct: 'enduring pain without showing feelings', options: ['talking too much', 'enduring pain without showing feelings', 'lasting only a moment', 'open and honest'] },
  { word: 'PRAGMATIC', correct: 'dealing with things sensibly and realistically', options: ['overly dramatic', 'of great wealth', 'dealing with things sensibly and realistically', 'completely original'] },
];

// ── Status Bar ────────────────────────────────────────────────
function StatusBar() {
  return (
    <div style={{ height: 54, display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', padding: '0 22px 10px', position: 'relative', zIndex: 20 }}>
      <span style={{ fontWeight: 600, fontSize: 15, color: '#fff', fontFamily: '-apple-system, system-ui' }}>9:41</span>
      <div style={{ width: 126, height: 34, borderRadius: 20, background: '#000', position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)' }} />
      <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="white" strokeOpacity="0.35" fill="none"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="white"/><path d="M23 4v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="white" fillOpacity="0.4"/></svg>
      </div>
    </div>
  );
}

// ── Typing indicator ──────────────────────────────────────────
function TypingDots() {
  return (
    <div style={{ display: 'flex', gap: 5, alignItems: 'center', padding: '8px 0' }}>
      {[0,1,2].map(i => (
        <div key={i} style={{
          width: 8, height: 8, borderRadius: '50%', background: C.yellow,
          animation: `dotBounce 1.2s ease ${i * 0.15}s infinite`,
        }} />
      ))}
    </div>
  );
}

// ── Highlighted passage renderer ───────────────────────────────
function HighlightedPassage({ text, vocabWords, onWordTap, activeWord }) {
  if (!text) return null;

  // Tokenize: split into words+punctuation, preserving spaces
  const tokens = text.split(/(\s+)/);
  const vocabSet = new Set(vocabWords.map(w => w.toUpperCase()));

  return (
    <div style={{
      fontFamily: 'Lora, serif', fontSize: 17, lineHeight: 1.85,
      color: 'rgba(255,255,255,0.9)',
      letterSpacing: 0.1,
    }}>
      {tokens.map((token, i) => {
        const clean = token.replace(/[^A-Z]/gi, '').toUpperCase();
        if (vocabSet.has(clean)) {
          return (
            <span
              key={i}
              className={`word-highlight${activeWord === clean ? ' active' : ''}`}
              onClick={() => onWordTap(clean)}
              style={{ fontStyle: 'italic', fontWeight: 600, color: '#FFE566' }}
            >{token}</span>
          );
        }
        return <span key={i}>{token}</span>;
      })}
    </div>
  );
}

// ── Word popover ───────────────────────────────────────────────
function WordPopover({ word, onClose }) {
  const data = REVIEW_WORDS.find(w => w.word === word);
  if (!data) return null;
  const color = MASTERY_COLOR[data.mastery];
  return (
    <div
      onClick={onClose}
      style={{
        position: 'absolute', inset: 0, zIndex: 200,
        display: 'flex', alignItems: 'flex-end',
        background: 'rgba(7,8,15,0.6)', backdropFilter: 'blur(4px)',
      }}
    >
      <div onClick={e => e.stopPropagation()} style={{
        width: '100%',
        background: 'linear-gradient(160deg, #16293D 0%, #0D1B2A 100%)',
        borderRadius: '18px 18px 0 0',
        border: '1px solid rgba(255,255,255,0.1)',
        padding: '16px 20px 48px',
        animation: 'popIn 0.25s cubic-bezier(0.22,1,0.36,1)',
      }}>
        <div style={{ width: 34, height: 4, background: 'rgba(255,255,255,0.2)', borderRadius: 2, margin: '0 auto 14px' }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
          <div style={{ fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 26, color: C.yellow, letterSpacing: -0.5 }}>{data.word}</div>
          <div style={{ background: `${color}20`, border: `1px solid ${color}40`, borderRadius: 6, padding: '2px 7px', fontFamily: 'Nunito', fontWeight: 800, fontSize: 9, color, textTransform: 'uppercase', letterSpacing: 0.5 }}>{data.mastery}</div>
        </div>
        <div style={{ fontFamily: 'Lora, serif', fontSize: 15, color: 'rgba(255,255,255,0.8)', lineHeight: 1.6, marginBottom: 14, fontStyle: 'italic' }}>
          "{data.def}"
        </div>
        <div style={{ height: 4, background: 'rgba(255,255,255,0.07)', borderRadius: 2, marginBottom: 12 }}>
          <div style={{ height: '100%', width: `${data.retention}%`, background: data.retention < 55 ? '#EF4444' : '#EAB308', borderRadius: 2 }} />
        </div>
        <div style={{ fontFamily: 'Nunito', fontSize: 11, color: C.muted }}>Retention: {data.retention}% · Tap anywhere to close</div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// STORY TAB
// ══════════════════════════════════════════════════════════════
function StoryTab({ reviewWords }) {
  const [passage, setPassage] = useState(null);
  const [passageWords, setPassageWords] = useState([]);
  const [loading, setLoading] = useState(false);
  const [activeWord, setActiveWord] = useState(null);
  const [fallbackIdx, setFallbackIdx] = useState(0);
  const [wordsHit, setWordsHit] = useState(0);
  const [absurdityLevel, setAbsurdityLevel] = useState('medium');

  const wordList = reviewWords.map(w => w.word).join(', ');

  const absurdityPrompts = {
    low: 'Make it slightly quirky but mostly realistic.',
    medium: 'Make it entertainingly absurd — ridiculous scenarios are fine as long as words are used correctly.',
    high: 'Make it maximally unhinged and bizarre. The more ridiculous the better. Think celebrity drama meets ancient Rome meets a fast food restaurant.',
  };

  const generate = useCallback(async () => {
    setLoading(true);
    setPassage(null);
    setActiveWord(null);

    const prompt = `You are a vocabulary teacher creating memorable study passages for SAT students. 

Generate a single short paragraph (2-4 sentences, max 80 words) that:
1. Uses as many of these words as possible IN CONTEXT: ${wordList}
2. Uses each word grammatically correctly with its real meaning
3. ${absurdityPrompts[absurdityLevel]}
4. Is a single coherent (if ridiculous) story or scenario

Return ONLY the paragraph. No title, no explanation, no quotes around it. Use the words in ALL CAPS exactly as provided.`;

    try {
      const result = await window.claude.complete(prompt);
      const text = result.trim();
      // find which vocab words appear
      const found = reviewWords.filter(w => text.toUpperCase().includes(w.word));
      setPassage(text);
      setPassageWords(found.map(w => w.word));
      setWordsHit(found.length);
    } catch (e) {
      // fallback
      const fb = FALLBACKS[fallbackIdx % FALLBACKS.length];
      setPassage(fb.text);
      setPassageWords(fb.words);
      setWordsHit(fb.words.length);
      setFallbackIdx(i => i + 1);
    } finally {
      setLoading(false);
    }
  }, [wordList, absurdityLevel, fallbackIdx]);

  // Generate on mount
  useEffect(() => { generate(); }, []);

  const hitWords = passageWords.length;
  const totalWords = reviewWords.length;

  return (
    <div style={{ padding: '0 14px', flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>

      {/* AI header */}
      <div style={{
        background: 'linear-gradient(135deg, #0f1e2e 0%, #162030 100%)',
        borderRadius: 14, padding: '12px 14px',
        border: '1px solid rgba(255,255,255,0.07)',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
          <div style={{
            width: 32, height: 32, borderRadius: 10,
            background: 'linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 16,
          }}>🤖</div>
          <div>
            <div style={{ fontFamily: 'Nunito', fontWeight: 900, fontSize: 13, color: '#fff' }}>AI Context Story</div>
            <div style={{ fontFamily: 'Nunito', fontSize: 10, color: C.muted }}>Targeting your {totalWords} most urgent words</div>
          </div>
          <div style={{ flex: 1 }} />
          {!loading && passage && (
            <div style={{
              background: hitWords >= 5 ? 'rgba(52,211,153,0.15)' : 'rgba(234,179,8,0.15)',
              border: `1px solid ${hitWords >= 5 ? 'rgba(52,211,153,0.3)' : 'rgba(234,179,8,0.3)'}`,
              borderRadius: 8, padding: '3px 8px',
              fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 11,
              color: hitWords >= 5 ? C.mint : '#EAB308',
            }}>{hitWords}/{totalWords} words</div>
          )}
        </div>

        {/* Absurdity slider */}
        <div style={{ display: 'flex', gap: 5 }}>
          {['low','medium','high'].map(level => (
            <div
              key={level}
              onClick={() => setAbsurdityLevel(level)}
              style={{
                flex: 1, height: 28, borderRadius: 7, cursor: 'pointer',
                background: absurdityLevel === level ? 'rgba(255,229,102,0.15)' : 'rgba(255,255,255,0.04)',
                border: `1px solid ${absurdityLevel === level ? 'rgba(255,229,102,0.3)' : 'rgba(255,255,255,0.06)'}`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontFamily: 'Nunito', fontWeight: 800, fontSize: 10,
                color: absurdityLevel === level ? C.yellow : C.muted,
                textTransform: 'uppercase', letterSpacing: 0.5,
              }}
            >{level === 'low' ? '😐 Mild' : level === 'medium' ? '😄 Absurd' : '🤪 Unhinged'}</div>
          ))}
        </div>
      </div>

      {/* Passage card */}
      <div style={{
        background: 'linear-gradient(160deg, #111e2d 0%, #0e1922 100%)',
        borderRadius: 18, padding: '18px 18px 16px',
        border: '1px solid rgba(255,255,255,0.09)',
        flex: 1,
        position: 'relative',
        minHeight: 180,
        display: 'flex', flexDirection: 'column',
        boxShadow: '0 8px 32px rgba(0,0,0,0.3)',
      }}>
        {/* decorative quote mark */}
        <div style={{
          position: 'absolute', top: 10, left: 14,
          fontFamily: 'Lora, serif', fontSize: 56, color: 'rgba(255,229,102,0.08)',
          lineHeight: 1, pointerEvents: 'none', userSelect: 'none',
        }}>"</div>

        {loading ? (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12 }}>
            <TypingDots />
            <div style={{ fontFamily: 'Nunito', fontSize: 12, color: C.muted, textAlign: 'center' }}>
              Writing a story around your<br />most urgent words…
            </div>
          </div>
        ) : passage ? (
          <div style={{ flex: 1, animation: 'fadeIn 0.5s ease' }}>
            <HighlightedPassage
              text={passage}
              vocabWords={passageWords}
              onWordTap={setActiveWord}
              activeWord={activeWord}
            />
          </div>
        ) : null}

        {/* word chips row */}
        {!loading && passageWords.length > 0 && (
          <div style={{ marginTop: 14, display: 'flex', flexWrap: 'wrap', gap: 5 }}>
            {passageWords.map(w => {
              const data = reviewWords.find(r => r.word === w);
              const color = data ? MASTERY_COLOR[data.mastery] : C.muted;
              return (
                <div
                  key={w}
                  onClick={() => setActiveWord(w)}
                  style={{
                    background: `${color}15`, border: `1px solid ${color}30`,
                    borderRadius: 7, padding: '3px 8px', cursor: 'pointer',
                    fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 10,
                    color,
                  }}
                >{w}</div>
              );
            })}
          </div>
        )}
      </div>

      {/* insight row */}
      {!loading && passage && (
        <div style={{
          background: 'rgba(99,102,241,0.08)', borderRadius: 12,
          border: '1px solid rgba(99,102,241,0.15)',
          padding: '9px 12px',
          display: 'flex', alignItems: 'center', gap: 8,
          animation: 'slideInUp 0.3s ease',
        }}>
          <span style={{ fontSize: 14 }}>💡</span>
          <div style={{ fontFamily: 'Nunito', fontSize: 11, color: 'rgba(255,255,255,0.65)', lineHeight: 1.4 }}>
            Seeing words in absurd context <span style={{ color: '#818CF8', fontWeight: 700 }}>improves recall by up to 40%</span>. Tap any highlighted word to review its meaning.
          </div>
        </div>
      )}

      {/* actions */}
      <div style={{ display: 'flex', gap: 8, paddingBottom: 4 }}>
        <button
          onClick={generate}
          disabled={loading}
          style={{
            flex: 1, height: 46, borderRadius: 13,
            background: loading ? 'rgba(255,255,255,0.05)' : 'linear-gradient(135deg, #FFE566, #F5A623)',
            border: 'none', cursor: loading ? 'not-allowed' : 'pointer',
            fontFamily: 'Nunito', fontWeight: 900, fontSize: 13,
            color: loading ? C.muted : '#3D2800',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
          }}
        >
          {loading ? <><TypingDots /></> : '✨ Generate New Story'}
        </button>
        <button style={{
          width: 46, height: 46, borderRadius: 13,
          background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.1)',
          cursor: 'pointer', fontSize: 18,
        }}>📤</button>
      </div>

      {activeWord && <WordPopover word={activeWord} onClose={() => setActiveWord(null)} />}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// FLASHCARD TAB
// ══════════════════════════════════════════════════════════════
function FlashcardTab() {
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [results, setResults] = useState({});
  const [done, setDone] = useState(false);

  const card = FLASHCARDS[idx];
  const color = MASTERY_COLOR[card.mastery];
  const total = FLASHCARDS.length;

  const handleResult = (knew) => {
    setResults(r => ({ ...r, [card.word]: knew }));
    if (idx < total - 1) {
      setFlipped(false);
      setTimeout(() => setIdx(i => i + 1), 200);
    } else {
      setDone(true);
    }
  };

  if (done) {
    const correct = Object.values(results).filter(Boolean).length;
    return (
      <div style={{ padding: '20px 14px', flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
        <div style={{ fontSize: 52 }}>{correct >= total * 0.7 ? '🎉' : '💪'}</div>
        <div style={{ fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 24, color: '#fff', textAlign: 'center' }}>
          {correct}/{total} Known
        </div>
        <div style={{ fontFamily: 'Nunito', fontSize: 14, color: C.muted, textAlign: 'center' }}>
          {correct >= total * 0.8 ? 'Great session! These words are getting stronger.' : 'Keep going — consistency is how mastery happens.'}
        </div>
        <button
          onClick={() => { setIdx(0); setFlipped(false); setResults({}); setDone(false); }}
          style={{
            height: 48, borderRadius: 14, padding: '0 28px',
            background: 'linear-gradient(135deg, #FFE566, #F5A623)',
            border: 'none', cursor: 'pointer',
            fontFamily: 'Nunito', fontWeight: 900, fontSize: 15, color: '#3D2800',
          }}
        >Review Again</button>
      </div>
    );
  }

  return (
    <div style={{ padding: '0 14px', flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
      {/* progress */}
      <div style={{ display: 'flex', gap: 4 }}>
        {FLASHCARDS.map((_, i) => (
          <div key={i} style={{
            flex: 1, height: 3, borderRadius: 2,
            background: i < idx ? C.mint : i === idx ? C.yellow : 'rgba(255,255,255,0.1)',
          }} />
        ))}
      </div>

      <div style={{ fontFamily: 'Nunito', fontSize: 11, color: C.muted, textAlign: 'center' }}>
        Card {idx + 1} of {total} · Tap card to reveal
      </div>

      {/* Flashcard */}
      <div
        onClick={() => setFlipped(!flipped)}
        style={{
          flex: 1, borderRadius: 20, cursor: 'pointer',
          position: 'relative',
          perspective: 1000,
          minHeight: 200,
        }}
      >
        {/* Front */}
        <div style={{
          position: 'absolute', inset: 0, borderRadius: 20,
          backfaceVisibility: 'hidden',
          background: 'linear-gradient(145deg, #16293D 0%, #1a3050 100%)',
          border: `2px solid ${color}40`,
          display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          padding: 24,
          opacity: flipped ? 0 : 1,
          transform: flipped ? 'rotateY(180deg)' : 'rotateY(0deg)',
          transition: 'all 0.4s cubic-bezier(0.4,0,0.2,1)',
          boxShadow: `0 0 40px ${color}15`,
        }}>
          <div style={{ fontFamily: 'Nunito', fontWeight: 700, fontSize: 10, color, textTransform: 'uppercase', letterSpacing: 1.5, marginBottom: 20 }}>What does this mean?</div>
          <div style={{
            fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 34,
            color: '#fff', letterSpacing: -1, marginBottom: 16,
          }}>{card.word}</div>
          <div style={{ height: 3, width: 40, background: `${color}60`, borderRadius: 2 }} />
          <div style={{ marginTop: 24, fontFamily: 'Nunito', fontSize: 11, color: C.dim }}>
            {card.retention}% retention · {card.reviews || 0} reviews
          </div>
          <div style={{ position: 'absolute', bottom: 16, right: 16, fontFamily: 'Nunito', fontSize: 11, color: C.dim }}>tap to flip →</div>
        </div>

        {/* Back */}
        <div style={{
          position: 'absolute', inset: 0, borderRadius: 20,
          backfaceVisibility: 'hidden',
          background: `linear-gradient(145deg, ${color}18 0%, #0e1a28 100%)`,
          border: `2px solid ${color}50`,
          display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          padding: 24,
          opacity: flipped ? 1 : 0,
          transform: flipped ? 'rotateY(0deg)' : 'rotateY(-180deg)',
          transition: 'all 0.4s cubic-bezier(0.4,0,0.2,1)',
        }}>
          <div style={{ fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 22, color: color, letterSpacing: -0.3, marginBottom: 14 }}>{card.word}</div>
          <div style={{ fontFamily: 'Lora, serif', fontSize: 16, color: '#fff', textAlign: 'center', lineHeight: 1.6, fontStyle: 'italic', marginBottom: 24 }}>
            "{card.def}"
          </div>
        </div>
      </div>

      {/* Did you know? buttons */}
      {flipped && (
        <div style={{ display: 'flex', gap: 10, animation: 'slideInUp 0.25s ease' }}>
          <button
            onClick={() => handleResult(false)}
            style={{
              flex: 1, height: 48, borderRadius: 13,
              background: 'rgba(239,68,68,0.1)', border: '1.5px solid rgba(239,68,68,0.3)',
              cursor: 'pointer', fontFamily: 'Nunito', fontWeight: 900, fontSize: 14, color: '#FCA5A5',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
            }}
          >😕 Still Learning</button>
          <button
            onClick={() => handleResult(true)}
            style={{
              flex: 1, height: 48, borderRadius: 13,
              background: 'rgba(52,211,153,0.1)', border: '1.5px solid rgba(52,211,153,0.3)',
              cursor: 'pointer', fontFamily: 'Nunito', fontWeight: 900, fontSize: 14, color: C.mint,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
            }}
          >✓ Got it!</button>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// QUIZ TAB
// ══════════════════════════════════════════════════════════════
function QuizTab() {
  const [idx, setIdx] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  const q = QUIZ_QUESTIONS[idx];
  const isCorrect = chosen === q.correct;

  const pick = (opt) => {
    if (chosen) return;
    setChosen(opt);
    if (opt === q.correct) setScore(s => s + 1);
    setTimeout(() => {
      if (idx < QUIZ_QUESTIONS.length - 1) {
        setIdx(i => i + 1);
        setChosen(null);
      } else {
        setDone(true);
      }
    }, 1000);
  };

  if (done) {
    const pct = Math.round((score / QUIZ_QUESTIONS.length) * 100);
    return (
      <div style={{ padding: '20px 14px', flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14 }}>
        <div style={{ fontSize: 48 }}>{pct >= 75 ? '🏆' : pct >= 50 ? '💪' : '📚'}</div>
        <div style={{ fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 28, color: '#fff' }}>{pct}%</div>
        <div style={{ fontFamily: 'Nunito', fontWeight: 700, fontSize: 16, color: C.muted }}>{score} of {QUIZ_QUESTIONS.length} correct</div>
        <button onClick={() => { setIdx(0); setChosen(null); setScore(0); setDone(false); }} style={{
          height: 48, borderRadius: 14, padding: '0 28px',
          background: 'linear-gradient(135deg, #FFE566, #F5A623)',
          border: 'none', cursor: 'pointer',
          fontFamily: 'Nunito', fontWeight: 900, fontSize: 15, color: '#3D2800',
        }}>Try Again</button>
      </div>
    );
  }

  return (
    <div style={{ padding: '0 14px', flex: 1, display: 'flex', flexDirection: 'column', gap: 14 }}>
      {/* progress */}
      <div style={{ display: 'flex', gap: 4 }}>
        {QUIZ_QUESTIONS.map((_, i) => (
          <div key={i} style={{ flex: 1, height: 3, borderRadius: 2, background: i <= idx ? C.yellow : 'rgba(255,255,255,0.1)' }} />
        ))}
      </div>

      <div style={{ fontFamily: 'Nunito', fontSize: 11, color: C.muted }}>Question {idx + 1} of {QUIZ_QUESTIONS.length}</div>

      {/* question */}
      <div style={{
        background: C.surface, borderRadius: 16, padding: '18px 18px 16px',
        border: '1px solid rgba(255,255,255,0.08)',
      }}>
        <div style={{ fontFamily: 'Nunito', fontWeight: 700, fontSize: 11, color: C.muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 10 }}>Which definition matches?</div>
        <div style={{ fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 28, color: C.yellow, letterSpacing: -0.5 }}>{q.word}</div>
      </div>

      {/* options */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {q.options.map((opt, i) => {
          let bg = 'rgba(255,255,255,0.05)';
          let border = 'rgba(255,255,255,0.08)';
          let textColor = '#fff';
          if (chosen) {
            if (opt === q.correct) { bg = 'rgba(52,211,153,0.12)'; border = 'rgba(52,211,153,0.4)'; textColor = C.mint; }
            else if (opt === chosen && opt !== q.correct) { bg = 'rgba(239,68,68,0.1)'; border = 'rgba(239,68,68,0.35)'; textColor = '#FCA5A5'; }
            else { bg = 'rgba(255,255,255,0.02)'; textColor = C.dim; }
          }
          return (
            <div
              key={i}
              onClick={() => pick(opt)}
              style={{
                background: bg, border: `1.5px solid ${border}`,
                borderRadius: 12, padding: '13px 14px',
                cursor: chosen ? 'default' : 'pointer',
                display: 'flex', alignItems: 'center', gap: 10,
                transition: 'all 0.2s',
              }}
            >
              <div style={{
                width: 26, height: 26, borderRadius: 8,
                background: chosen && opt === q.correct ? 'rgba(52,211,153,0.2)' : chosen && opt === chosen && opt !== q.correct ? 'rgba(239,68,68,0.15)' : 'rgba(255,255,255,0.07)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 12, color: textColor, flexShrink: 0,
              }}>
                {chosen && opt === q.correct ? '✓' : chosen && opt === chosen && opt !== q.correct ? '✗' : String.fromCharCode(65+i)}
              </div>
              <div style={{ fontFamily: 'Nunito', fontSize: 13, color: textColor, lineHeight: 1.4 }}>{opt}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
