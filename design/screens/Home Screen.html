<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexicon – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #07080f;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 0; }

    @keyframes wordFloat {
      0%   { opacity: 0; transform: translateY(6px) scale(0.97); }
      18%  { opacity: var(--peak); }
      82%  { opacity: var(--peak); }
      100% { opacity: 0; transform: translateY(-8px) scale(1.02); }
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.55; }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    @keyframes streakBounce {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }
    @keyframes glowRing {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,229,102,0.25); }
      50%      { box-shadow: 0 0 0 8px rgba(255,229,102,0); }
    }
    @keyframes rotateSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ── Palette ────────────────────────────────────────────────────
const C = {

// ── Floating word data ─────────────────────────────────────────

  { w:'CONCISE',    x:75,  y:88,  fs:13, pk:0.06, dur:10, del:6.5,  hue:'yellow' },

  { w:'INNATE',     x:3,   y:72,  fs:19, pk:0.08, dur:9,  del:2.2,  hue:'yellow' },
  { w:'PERVASIVE',  x:65,  y:3,   fs:12, pk:0.06, dur:14, del:5.5,  hue:'white'  },
  { w:'ASTUTE',     x:34,  y:20,  fs:21, pk:0.09, dur:11, del:1.2,  hue:'mint'   },
  { w:'INSOLENT',   x:90,  y:22,  fs:13, pk:0.06, dur:13, del:8.5,  hue:'blue'   },
  { w:'PERSEVERE',  x:18,  y:95,  fs:11, pk:0.05, dur:12, del:0.3,  hue:'white'  },
  { w:'WANE',       x:50,  y:70,  fs:24, pk:0.10, dur:10, del:4.8,  hue:'yellow' },
  { w:'PONDER',     x:72,  y:15,  fs:15, pk:0.07, dur:11, del:6.2,  hue:'mint'   },
  { w:'VACUOUS',    x:12,  y:55,  fs:13, pk:0.06, dur:14, del:9.5,  hue:'blue'   },

const HUE_COLOR = {
  yellow: 'rgba(255,229,102,VAR)',
  blue:   'rgba(96,165,250,VAR)',
  mint:   'rgba(52,211,153,VAR)',
  white:  'rgba(255,255,255,VAR)',
};

// ── Floating background words ──────────────────────────────────
function BackgroundWords() {
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>
      {VOCAB_WORDS.map((v, i) => {
        const baseColor = HUE_COLOR[v.hue].replace('VAR', v.pk);
        return (
          <div
            key={i}
            style={{
              position: 'absolute',
              left: `${v.x}%`,
              top: `${v.y}%`,
              fontFamily: 'Space Grotesk, sans-serif',
              fontWeight: 700,
              fontSize: v.fs,
              color: baseColor,
              letterSpacing: v.fs > 16 ? -0.5 : 0.5,
              whiteSpace: 'nowrap',
              '--peak': v.pk,
              animation: `wordFloat ${v.dur}s ease-in-out ${v.del}s infinite`,
              userSelect: 'none',
              textTransform: 'uppercase',
            }}
          >{v.w}</div>
        );
      })}
    </div>
  );
}

// ── Mesh gradient bg ───────────────────────────────────────────
function MeshBg() {
  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
      {/* base */}
      <div style={{ position: 'absolute', inset: 0, background: '#0D1B2A' }} />
      {/* radial blobs */}
      <div style={{ position: 'absolute', top: '-10%', left: '-20%', width: '70%', height: '60%', borderRadius: '50%', background: 'radial-gradient(ellipse, rgba(99,102,241,0.12) 0%, transparent 70%)' }} />
      <div style={{ position: 'absolute', bottom: '-5%', right: '-15%', width: '60%', height: '55%', borderRadius: '50%', background: 'radial-gradient(ellipse, rgba(52,211,153,0.07) 0%, transparent 70%)' }} />

}

        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="white"/><path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="white"/><circle cx="8.5" cy="10.5" r="1.5" fill="white"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="white" strokeOpacity="0.35" fill="none"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="white"/><path d="M23 4v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="white" fillOpacity="0.4"/></svg>

// ── App logo ───────────────────────────────────────────────────
function Logo() {
  return (
    <div style={{ padding: '4px 18px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
      <div>
        <div style={{
          fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 28,

// ── Stats row ──────────────────────────────────────────────────
function StatsRow() {
  const stats = [
    { icon: '🔥', value: '7', label: 'Day Streak', color: '#FF6B35', bg: 'rgba(255,107,53,0.1)', border: 'rgba(255,107,53,0.2)', anim: 'streakBounce 2s ease infinite' },
    { icon: '📚', value: '20', label: 'Collected', color: C.yellow, bg: 'rgba(255,229,102,0.08)', border: 'rgba(255,229,102,0.18)' },
    { icon: '⬟',  value: '4',  label: 'Mastered',  color: '#D8B4FE', bg: 'rgba(168,85,247,0.08)', border: 'rgba(168,85,247,0.18)' },
    { icon: '🏆', value: '#3', label: 'Class Rank', color: '#818CF8', bg: 'rgba(99,102,241,0.08)', border: 'rgba(99,102,241,0.2)' },

        </div>
      ))}

}

// ── Daily puzzle card ──────────────────────────────────────────
function DailyCard({ onPlay }) {
  const [hover, setHover] = useState(false);
  return (
    <div
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      onClick={onPlay}
      style={{
        margin: '12px 14px 0',
        background: 'linear-gradient(140deg, #1a2e46 0%, #132236 60%, #1a2a20 100%)',
        borderRadius: 20,
        border: '1.5px solid rgba(255,229,102,0.2)',
        padding: '18px 18px 16px',
        cursor: 'pointer',
        position: 'relative', overflow: 'hidden',
        boxShadow: hover
          ? '0 8px 40px rgba(255,229,102,0.15), 0 2px 8px rgba(0,0,0,0.3)'
          : '0 4px 20px rgba(0,0,0,0.25)',
        transition: 'box-shadow 0.3s, transform 0.2s',
        transform: hover ? 'translateY(-1px)' : 'none',
        animation: 'slideUp 0.5s ease 0.1s both',
        flexShrink: 0,
      }}
    >
      {/* shimmer overlay */}

        position: 'absolute', inset: 0,

        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
            <div style={{
              background: 'linear-gradient(135deg, #FFE566, #F5A623)',
              borderRadius: 7, padding: '2px 8px',
              fontFamily: 'Nunito', fontWeight: 900, fontSize: 9,
              color: '#3D2800', letterSpacing: 1, textTransform: 'uppercase',
            }}>Daily Mini</div>
            <div style={{
              background: 'rgba(52,211,153,0.15)', border: '1px solid rgba(52,211,153,0.3)',
              borderRadius: 7, padding: '2px 7px',
              fontFamily: 'Nunito', fontWeight: 800, fontSize: 9, color: C.mint,
            }}>New Today</div>
          </div>
          <div style={{
            fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 22,

            }} />
          ))}
        </div>
      </div>

      {/* word preview */}
      <div style={{
        background: 'rgba(0,0,0,0.2)', borderRadius: 10, padding: '8px 10px',
        marginBottom: 14, border: '1px solid rgba(255,255,255,0.06)',
      }}>
        <div style={{ fontFamily: 'Nunito', fontSize: 9, color: C.dim, textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 5 }}>Today's featured words include</div>
        <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>

        <span style={{ fontFamily: 'Nunito', fontWeight: 900, fontSize: 15, color: '#3D2800' }}>Play Today's Puzzle</span>

    </div>

// ── Quick action tiles ─────────────────────────────────────────
function QuickActions({ active, onSelect }) {
  const actions = [
    {
      id: 'collection',
      icon: '⭐',
      label: 'Collection',
      sub: '20 words',
      color: '#FFE566',
      bg: 'rgba(255,229,102,0.08)',
      border: 'rgba(255,229,102,0.2)',
    },
    {
      id: 'review',

    },
    {
      id: 'write',
      icon: '✏️',

            key={a.id}

              display: 'flex', alignItems: 'center', gap: 10,
              transition: 'all 0.2s',
              animation: `slideUp 0.4s ease ${0.3 + i * 0.06}s both`,
              position: 'relative',
            }}
          >
            {a.badge && (
              <div style={{
                position: 'absolute', top: 8, right: 10,
                background: '#EF4444', borderRadius: '50%',
                width: 16, height: 16,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontFamily: 'Nunito', fontWeight: 900, fontSize: 9, color: '#fff',
              }}>{a.badge}</div>
            )}
            <div style={{
              width: 36, height: 36, borderRadius: 10, background: `${a.color}18`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 18, flexShrink: 0,
            }}>{a.icon}</div>
            <div>
              <div style={{ fontFamily: 'Nunito', fontWeight: 800, fontSize: 13, color: active === a.id ? a.color : '#fff' }}>{a.label}</div>
              <div style={{ fontFamily: 'Nunito', fontSize: 10, color: C.muted }}>{a.sub}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Recent words ticker ────────────────────────────────────────
function RecentTicker() {
  const words = ['LUCID', 'TERSE', 'HUMOR', 'CROSS', 'CANDOR', 'BANAL'];
  const [idx, setIdx] = useState(0);

  useEffect(() => {
    const t = setInterval(() => setIdx(i => (i + 1) % words.length), 2200);
    return () => clearInterval(t);
  }, []);

  return (
    <div style={{
      margin: '8px 14px 0',
      background: 'rgba(255,255,255,0.03)',
      borderRadius: 11, padding: '7px 12px',
      border: `1px solid ${C.border}`,
      display: 'flex', alignItems: 'center', gap: 8,
      animation: 'slideUp 0.4s ease 0.5s both',
      flexShrink: 0,
    }}>
      <div style={{ width: 6, height: 6, borderRadius: '50%', background: C.mint, animation: 'pulse 1.5s ease infinite', flexShrink: 0 }} />
      <div style={{ fontFamily: 'Nunito', fontSize: 11, color: C.muted }}>Your class just collected</div>
      <div key={idx} style={{
        fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 12, color: C.yellow,
        animation: 'fadeIn 0.4s ease',
      }}>{words[idx]}</div>
    </div>
  );
}

// ── Bottom nav ─────────────────────────────────────────────────
function BottomNav({ active, onSelect }) {
  const items = [
    { id: 'home',     icon: '⊞',  label: 'Home'       },
    { id: 'puzzle',   icon: '✦',  label: 'Puzzles'    },
    { id: 'collection', icon: '⭐', label: 'Collection' },
    { id: 'review',   icon: '↺',  label: 'Review'     },
    { id: 'profile',  icon: '○',  label: 'Profile'    },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      background: 'rgba(10,16,26,0.95)',
      backdropFilter: 'blur(20px)',
      borderTop: '1px solid rgba(255,255,255,0.07)',
      padding: '8px 0 28px',
      display: 'flex',
      zIndex: 40,
    }}>
      {items.map(item => {
        const isActive = active === item.id;
        return (
          <div
            key={item.id}
            onClick={() => onSelect(item.id)}
            style={{
              flex: 1,
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
              cursor: 'pointer',
            }}
          >
            <div style={{
              width: 32, height: 32, borderRadius: 10,
              background: isActive ? 'rgba(255,229,102,0.12)' : 'transparent',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 18,
              color: isActive ? C.yellow : C.muted,
              transition: 'all 0.2s',
            }}>{item.icon}</div>
            <span style={{
              fontFamily: 'Nunito', fontWeight: isActive ? 800 : 600,
              fontSize: 9, color: isActive ? C.yellow : C.dim,
              textTransform: 'uppercase', letterSpacing: 0.4,
            }}>{item.label}</span>
          </div>
        );
      })}
    </div>
  );
}
